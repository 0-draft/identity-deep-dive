name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tracks/**/reports/**"
      - "tracks/**/data/normalized/**"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  # The collectors push with GITHUB_TOKEN, and a GITHUB_TOKEN push never fires
  # `push` workflows, so without this the site only moved on human commits.
  # The collectors are a fail-fast: false matrix, so a run that "failed" on one
  # track has still pushed the other two; only a cancelled run is skipped.
  workflow_run:
    workflows: ["Daily Update (All Tracks)", "Weekly Digest (All Tracks)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          PAGES_SITE: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
