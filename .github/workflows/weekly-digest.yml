name: Weekly Digest (All Tracks)

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with the daily update: both commit the same track files, and runs
# that overlap would push over each other. (What the daily run diffs against is
# insights_baseline.json. This workflow only creates it when it is missing and
# never advances an existing one.)
concurrency:
  group: track-update
  cancel-in-progress: false

jobs:
  weekly:
    strategy:
      fail-fast: false
      matrix:
        track: [ietf-wimse, oauth-wg, openid]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracks/${{ matrix.track }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
      - run: make install
      - run: make weekly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # score.py rewrote candidates.json, so put the stored triage back on it.
      - name: Re-apply stored insights
        run: python ../../scripts/insights/apply.py --track ${{ matrix.track }}
      - name: Commit and push (rebase-retry)
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracks/${{ matrix.track }}/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore(${{ matrix.track }}): weekly digest $(date -u +%Y-W%V)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying after backoff..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 5 attempts"
          exit 1
