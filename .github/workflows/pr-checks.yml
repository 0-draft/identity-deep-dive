name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile all Python scripts
        run: python -m compileall -q tracks/*/scripts scripts
      - name: Check the spec explainers against their template
        run: python scripts/landscape/explainers.py
      - name: Check the RFC texts and translations are well formed
        run: |
          for d in data/rfc/*/; do
            python - "$d" <<'PY'
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          en = json.loads((d / "en.json").read_text())
          ids = {p["id"]: p["kind"] for s in en["sections"] for p in s["paragraphs"]}
          if (d / "ja.json").exists():
              ja = json.loads((d / "ja.json").read_text())
              bad = [k for k in ja["paragraphs"] if ids.get(k) in (None, "pre")]
              if bad:
                  sys.exit(f"{d}: translated paragraphs that do not exist or are preformatted: {bad[:5]}")
              if ja["source_hash"] != en["content_hash"]:
                  print(f"::warning::{d}: translation predates the current English text")
          PY
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          shopt -s nullglob globstar
          files=(scripts/*.sh tracks/*/scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found"
            exit 0
          fi
          shellcheck "${files[@]}"
